              </div>
              <div class="field"><label for="item-url">Session ID 或原对话链接（可选）</label><input id="item-url" name="url" value="${escapeHtml(value.url || "")}" placeholder="粘贴 Session ID、ChatGPT / Codex 对话链接" /><p class="field-hint">也可以关闭窗口后，直接把链接或文本拖入对应区域。</p></div>
              <div class="field"><label>优先级</label><div class="marker-options">${Object.entries(markers).map(([key, marker]) => `<label class="marker-option" title="${escapeHtml(marker.label)}"><input type="radio" name="marker" value="${key}" ${value.marker === key || (!value.marker && key === "p2") ? "checked" : ""} /><span class="marker-swatch" style="--swatch:${escapeHtml(marker.color)}"></span></label>`).join("")}</div><p class="field-hint">P0 紧急 · P1 重要 · P2 普通</p></div>
              <label class="check-row"><input name="pinned" type="checkbox" ${value.pinned ? "checked" : ""} /> 在当前${fixedKind === "chat" ? "分类" : "项目"}置顶</label>
              <div class="form-actions">${item ? '<button type="button" class="danger-link" data-delete-item>删除</button>' : ""}<button type="button" class="button" data-close-modal>取消</button><button type="submit" class="button primary">保存</button></div>
            </form>
          </section>
        </div>
      `;
    }

    function floatingMenuMarkup() {
      if (!floatingMenu) return "";
      const left = Math.max(8, Math.min(window.innerWidth - 162, floatingMenu.left));
      const top = Math.max(8, Math.min(window.innerHeight - (floatingMenu.type === "priority" ? 142 : 196), floatingMenu.top));
      if (floatingMenu.type === "priority") {
        const item = board.items.find(entry => entry.id === floatingMenu.itemId);
        return `<div class="floating-menu" role="menu" aria-label="选择优先级" style="left:${left}px;top:${top}px">${Object.entries(markers).map(([key, marker]) => `<button type="button" role="menuitemradio" aria-checked="${(item?.marker || "p2") === key}" data-set-priority="${key}" data-item-id="${escapeHtml(floatingMenu.itemId)}"><span class="priority-chip" style="--priority-color:${escapeHtml(marker.color)}"></span><span>${escapeHtml(marker.label)}</span><small>${key.toUpperCase()}</small></button>`).join("")}</div>`;
      }
      const choices = [
        ["manual", "手动排序"],
        ["updated", "最近更新"],
        ["created-desc", "创建时间倒序"],
        ["created-asc", "创建时间正序"],
        ["importance", "重要性"]
      ];
      const selected = floatingMenu.scope === "chat"
        ? board.chatSortBy?.[floatingMenu.topic] || "updated"
        : board.projects.find(entry => entry.id === floatingMenu.projectId)?.sortBy || "updated";
      const scopeAttributes = floatingMenu.scope === "chat"
        ? `data-chat-topic="${escapeHtml(floatingMenu.topic)}"`
        : `data-project-id="${escapeHtml(floatingMenu.projectId)}"`;
      return `<div class="floating-menu" role="menu" aria-label="${floatingMenu.scope === "chat" ? "Chat 排序" : "项目排序"}" style="left:${left}px;top:${top}px">${choices.map(([key, label]) => `<button type="button" role="menuitemradio" aria-checked="${selected === key}" data-set-sort="${key}" ${scopeAttributes}><span>${label}</span></button>`).join("")}</div>`;
    }

    function openFloatingMenu(type, id, anchor) {
      const rect = anchor.getBoundingClientRect();
      floatingMenu = type === "priority"
        ? { type, itemId: id, left: rect.right - 154, top: rect.bottom + 6 }
        : type === "chat-sort"
          ? { type: "sort", scope: "chat", topic: id, left: rect.right - 154, top: rect.bottom + 6 }
          : { type, scope: "project", projectId: id, left: rect.right - 154, top: rect.bottom + 6 };
      render();
    }

    function render() {
      const chatSort = board.chatSortBy?.[activeTab] || "updated";
      const chats = sortItems(board.items.filter(item => item.kind === "chat" && item.topic === activeTab && itemMatches(item)), chatSort);
      const sortedProjects = [...board.projects].sort((a, b) => (a.order || 0) - (b.order || 0));
      const chatCount = board.items.filter(item => item.kind === "chat").length;
      const professionalCount = board.items.filter(item => item.kind === "chat" && item.topic === "professional").length;
      const personalCount = board.items.filter(item => item.kind === "chat" && item.topic === "personal").length;
      const workCount = board.items.filter(item => item.kind !== "chat").length;
      document.getElementById("app").innerHTML = `
        <main class="app-shell" data-board-view>
          <header class="topbar">
            <div class="brand">
              <div class="brand-line"><span class="brand-mark" aria-hidden="true"></span><h1>Aboard</h1></div>
              <p>A more efficient interface for AI conversations.</p>
            </div>
            <label class="search-wrap">
              <span class="sr-only">搜索全部对话</span>${icons.search}
              <input class="search" id="search" value="${escapeHtml(query)}" placeholder="搜索会话标题…" autocomplete="off" />
              <span class="keycap">⌘ S</span>
            </label>
          </header>

          <section class="board">
            <aside class="chat-column">
              <div class="section-head"><div class="section-title-wrap"><h2 class="section-title">Chats</h2><span class="count">${chatCount}</span></div></div>
              <div class="tabs" role="tablist" aria-label="Chat 分类">
                <button class="tab drop-target ${activeTab === "professional" ? "active" : ""}" data-tab="professional" data-drop-kind="chat" data-drop-topic="professional" data-drop-label="移到专业会话" role="tab" aria-selected="${activeTab === "professional"}">专业会话 <span class="tab-count">${professionalCount}</span></button>
                <button class="tab drop-target ${activeTab === "personal" ? "active" : ""}" data-tab="personal" data-drop-kind="chat" data-drop-topic="personal" data-drop-label="移到个人会话" role="tab" aria-selected="${activeTab === "personal"}">个人会话 <span class="tab-count">${personalCount}</span></button>
              </div>
              <div class="chat-list-tools">
                <button class="list-add" data-action="add-chat"><span aria-hidden="true">＋</span> 添加新会话</button>
                <button class="chat-sort ${chatSort === "manual" ? "is-manual" : ""}" data-chat-sort-menu="${escapeHtml(activeTab)}" aria-label="${activeTab === "professional" ? "专业会话" : "个人会话"}排序：${escapeHtml(sortLabel(chatSort))}" aria-haspopup="menu">${icons.sort}</button>
              </div>
              <div class="chat-list drop-target" data-drop-kind="chat" data-drop-topic="${escapeHtml(activeTab)}" data-drop-label="移到${activeTab === "professional" ? "专业会话" : "个人会话"}">${chats.length ? chats.map(chatRow).join("") : `<div class="empty"><strong>${query ? "没有匹配的会话" : "暂无会话"}</strong>${query ? "换一个标题关键词" : "添加或从左侧拖入一个 Chat 会话"}</div>`}</div>
            </aside>

            <section class="work-column">
              <div class="work-header">
                <div class="section-title-wrap"><h2 class="section-title">Work</h2><span class="count">${workCount}</span></div>
                <button class="button" data-action="add-project"><span aria-hidden="true">＋</span> 新建项目</button>
              </div>
              <div class="project-grid" role="list" aria-label="Work 项目">${projectGridMarkup(sortedProjects)}</div>
            </section>
          </section>
        </main>
        ${modalMarkup()}
        ${floatingMenuMarkup()}
      `;
      updateConditionalFields();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function setDragGuide(visible) {
      document.getElementById("drag-guide")?.classList.toggle("show", Boolean(visible));
      if (!visible) {
        clearNativeDropFeedback();
        document.querySelectorAll(".is-drop-active, .is-drop-invalid").forEach(element => element.classList.remove("is-drop-active", "is-drop-invalid"));
      }
    }

    function payloadThreads(payload) {
      return (Array.isArray(payload?.threads) ? payload.threads : [payload]).filter(Boolean);
    }

    function nativePayloadFromTransfer(dataTransfer) {
      if (dataTransfer) {
        for (const mime of [nativeThreadMime, legacyNativeThreadMime]) {
          try {
            const raw = dataTransfer.getData(mime);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (mime === nativeThreadMime && parsed?.payload) return parsed.payload;
              return parsed;
            }
          } catch (_) {}
        }
      }
      try { return window.parent.__conversationDashboardDraggedThread || null; }
      catch (_) { return null; }
    }

    function nativeKinds(dataTransfer, payload) {
      const types = new Set([...(dataTransfer?.types || [])].map(type => String(type).toLowerCase()));
      const kinds = new Set();
      if (types.has(nativeChatKindMime)) kinds.add("chat");
      if (types.has(nativeWorkKindMime)) kinds.add("work");
      if (kinds.size) return kinds;
      for (const thread of payloadThreads(payload)) {
        if (["chat", "work"].includes(thread?.surfaceKind)) kinds.add(thread.surfaceKind);
      }
      return kinds;
    }

    function nativeSessionId(dataTransfer) {
      try {
        const raw = dataTransfer?.getData(nativeThreadMime);
        if (raw) return String(JSON.parse(raw)?.sessionId || "");
      } catch (_) {}
      try { return String(window.parent.__conversationDashboardDragSession?.id || ""); }
      catch (_) { return ""; }
    }

    function isNativeThreadDrag(dataTransfer, payload = null) {
      const types = new Set([...(dataTransfer?.types || [])].map(type => String(type).toLowerCase()));
      return Boolean(payload)
        || types.has(nativeThreadMime)
        || types.has(legacyNativeThreadMime)
        || types.has(nativeChatKindMime)
        || types.has(nativeWorkKindMime);
    }

    function validateDropTarget(target, payload, dataTransfer = null) {
      const expectedKind = target?.dataset.dropKind === "chat" ? "chat" : "work";
      const kinds = nativeKinds(dataTransfer, payload);
      if (!kinds.size) return true;
      return kinds.size === 1 && kinds.has(expectedKind);
    }

    function setNativeDropFeedback(target, validity) {
      if (activeNativeDropTarget === target && activeNativeDropValidity === validity) return;
      activeNativeDropTarget?.classList.remove("is-drop-active", "is-drop-invalid");
      activeNativeDropTarget = target || null;
      activeNativeDropValidity = target ? Boolean(validity) : null;
      if (!target) return;
      target.classList.toggle("is-drop-active", Boolean(validity));
      target.classList.toggle("is-drop-invalid", !validity);
    }

    function clearNativeDropFeedback() {
      setNativeDropFeedback(null, null);
    }

    async function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          if (window.openai?.callTool) {
            await window.openai.callTool("save_dashboard", { board });
            showToast("已保存");
          } else if (embeddedMode) {
            window.parent.localStorage.setItem(storageKey, JSON.stringify(board));
            showToast("已保存");
          } else {
            showToast("预览模式：更改仅保留在当前页面");
          }
        } catch (error) {
          showToast("保存失败，请重新打开 Aboard 后再试");
        }
      }, 260);
    }

    function updateBoard(mutator) {
      mutator(board);
      render();
      save();
    }

    function renameNativeItem(previous, nextItem) {
      if (!embeddedMode || !nextItem.url || previous?.title === nextItem.title) return;
      window.parent.postMessage({
        method: "conversation-dashboard/rename-native",
        payload: {
          id: threadIdFromUrl(nextItem.url),
          url: nextItem.url,
          title: nextItem.title,
          previousTitle: previous?.title || ""
        }
      }, "*");
    }

    function syncNativeMetadata(entries) {
      if (!Array.isArray(entries) || !entries.length) return;
      const metadata = new Map(entries.map(entry => [entry.id, entry]));
      let changed = false;
      for (const item of board.items) {
        const entry = metadata.get(threadIdFromUrl(item.url));
        if (!entry) continue;
        for (const key of ["title", "createdAt", "updatedAt"]) {
          if (entry[key] && item[key] !== entry[key]) {
            item[key] = entry[key];
            changed = true;
          }
        }
      }
      if (changed) {
        render();
        save();
      }
    }

    function localRuntimeThreadIds() {
      return [...new Set(board.items.flatMap(item => {
        const url = String(item.url || "");
        if (!/^codex:\/\/threads\//i.test(url)) return [];
        const id = threadIdFromUrl(url).toLowerCase();
        return /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/.test(id) ? [id] : [];
      }))];
    }

    function requestNativeRuntimeStatus() {
      if (!embeddedMode) return;
      window.parent.postMessage({
        method: "conversation-dashboard/request-runtime-status",
        payload: { ids: localRuntimeThreadIds() }
      }, "*");
    }

    function syncNativeRuntimeStatus(entries) {
      if (!Array.isArray(entries)) return;
      const next = new Map(entries.flatMap(entry => {
        const id = String(entry?.id || "").trim().toLowerCase();
        if (!/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/.test(id)) return [];
        const runtimeStatus = entry?.runtimeStatus === "active" ? "active" : "idle";
        const progressValue = Number(entry?.progress);
        const progress = Number.isFinite(progressValue) ? Math.max(0, Math.min(100, Math.round(progressValue))) : null;
        return [[id, { runtimeStatus, progress }]];
      }));
      const signature = JSON.stringify([...next].sort(([a], [b]) => a.localeCompare(b)));
      if (signature === lastRuntimeStatusSignature) return;
      lastRuntimeStatusSignature = signature;
      liveRuntime = next;
      for (const item of board.items) {
        const row = document.querySelector(`[data-drag-item="${CSS.escape(item.id)}"]`);
        if (!row) continue;
        const runtime = runtimeState(item);
        const progress = itemProgress(item);
        row.classList.toggle("is-running", runtime.className === "is-running");
        row.classList.toggle("is-waiting", runtime.className === "is-waiting");
        row.dataset.progress = String(progress);
        row.style.setProperty("--progress-width", `${progress}%`);
        const meta = row.querySelector(".row-meta, .project-meta");
        if (!meta) continue;
        meta.querySelectorAll(".runtime-status, .runtime-progress").forEach(element => element.remove());
        if (runtime.label) {
          meta.insertAdjacentHTML("beforeend", `<span class="runtime-status ${runtime.labelClass}">${runtime.label}</span>`);
        }
        if (progress > 0) {
          meta.insertAdjacentHTML("beforeend", `<span class="runtime-progress" title="上下文使用量 ${progress}%">${progress}%</span>`);
        }
      }
    }

    function openItem(id) {
      const item = board.items.find(entry => entry.id === id);
      if (!item) return;
      const directUrl = sessionUrl(item.url, item.kind);
      if (!directUrl) {
        if (item.titleHidden) {
          showToast(item.url ? "原对话链接格式无效，请通过设置重新绑定" : "此会话尚未绑定链接，请通过设置完成绑定");
          return;
        }
        modal = { type: "item", itemId: item.id };
        render();
        showToast(item.url ? "原对话链接格式无效，请重新绑定" : "先绑定原对话链接，之后点击名称即可打开");
        return;
      }
      const signature = `${item.kind}:${directUrl}`;
      const now = Date.now();
      if (signature === lastOpenSignature && now - lastOpenAt < 900) return;
      lastOpenSignature = signature;
      lastOpenAt = now;
      const nativeId = threadIdFromUrl(directUrl);
      const payload = {
        id: nativeId,
        url: directUrl,
        title: item.titleHidden ? "" : item.title,
        kind: item.kind,
        hostId: item.hostId || "",
        runtimeStatus: String(liveRuntimeEntry(item)?.runtimeStatus || item.runtimeStatus || "idle")
      };
      if (embeddedMode) {
        window.parent.postMessage({
          method: "conversation-dashboard/open-native",
          payload
        }, "*");
        return;
      }
      if (window.openai?.callTool) {
        let toolCall;
        try { toolCall = window.openai.callTool("open_conversation", payload); }
        catch (_) {
          showToast("无法在 ChatGPT/Codex 中打开该会话，请重试");
          return;
        }
        Promise.resolve(toolCall)
          .then(result => {
            if (result?.isError === true || result?.error || result?.ok === false || result?.structuredContent?.ok === false) {
              showToast("无法在 ChatGPT/Codex 中打开该会话，请重试");
            }
          })
          .catch(() => {
            showToast("无法在 ChatGPT/Codex 中打开该会话，请重试");
          });
        return;
      }
      if (window.openai?.openExternal) {
        let externalOpen;
        try { externalOpen = window.openai.openExternal({ href: directUrl, redirectUrl: false }); }
        catch (_) {
          showToast("无法打开该会话，请重试");
          return;
        }
        Promise.resolve(externalOpen).catch(() => {
          showToast("无法打开该会话，请重试");
        });
      } else {
        window.open(directUrl, "_blank", "noopener,noreferrer");
      }
    }

    function isSupportedConversationUrl(value) {
      try {
        const url = new URL(String(value || ""));
        if (url.username || url.password || url.port || url.hash) return false;
        const pathname = decodeURIComponent(url.pathname);
        if (url.protocol === "codex:") {
          const query = [...url.searchParams.entries()];
          return url.hostname === "threads"
            && /^\/[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}\/?$/i.test(pathname)
            && query.length <= 1
            && query.every(([key, entry]) => key === "hostId" && entry.trim());
        }
        return url.protocol === "https:"
          && ["chatgpt.com", "www.chatgpt.com", "chat.openai.com", "www.chat.openai.com"].includes(url.hostname)
          && /^\/c\/[A-Za-z0-9_-]{12,}\/?$/.test(pathname);
      } catch (_) {
        return false;
      }
    }

    function sessionUrl(value, kind = "chat") {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (/^(https?|codex):\/\//i.test(raw)) return isSupportedConversationUrl(raw) ? raw : "";
      const workId = raw.match(/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i)?.[0];
      const chatId = raw.match(/^[A-Za-z0-9_-]{12,}$/)?.[0];
      const id = kind === "work" ? workId : chatId;
      return id ? (kind === "work" ? `codex://threads/${id}` : `https://chatgpt.com/c/${id}`) : "";
    }

    function importPayload(dataTransfer) {
      const uri = dataTransfer?.getData("text/uri-list")?.split(/\r?\n/).find(line => line && !line.startsWith("#")) || "";
      const text = dataTransfer?.getData("text/plain")?.trim() || "";
      const html = dataTransfer?.getData("text/html") || "";
      const href = html.match(/href=["']([^"']+)/i)?.[1] || "";
      const raw = uri || href || text;
      const url = /^(https?|codex):\/\//i.test(raw) ? raw : "";
      const htmlTitle = html.match(/<a\b[^>]*>(.*?)<\/a>/is)?.[1]?.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      const textTitle = text && !sessionUrl(text) ? text.split(/\r?\n/)[0].trim() : "";
      const id = raw.match(/[0-9a-f]{8}-[0-9a-f-]{20,}/i)?.[0];
      return { raw, url, title: htmlTitle || textTitle || (id ? `Imported session · ${id.slice(0, 8)}` : "Imported conversation") };
    }

    function openImportEditor(target, payload) {
      const kind = target.dataset.dropKind === "chat" ? "chat" : "work";
      const url = sessionUrl(payload.url || payload.raw, kind);
      if ((payload.url || /^(https?|codex):\/\//i.test(String(payload.raw || ""))) && !url) {
        showToast("仅支持有效的 ChatGPT 或 Codex 原对话链接");
        return;
      }
      if (!url && !payload.title) {
        showToast("没有识别到 Session ID、链接或标题");
        return;
      }
      const duplicate = matchingThreadItem(board.items, url);
      if (duplicate) {
        if (duplicate.kind !== kind) {
          showToast(`${kindLabel(duplicate.kind)} 不能移入 ${kind === "chat" ? "Chats" : "Work 项目"}；类型不匹配`);
          return;
        }
        modal = kind === "chat"
          ? { type: "item", itemId: duplicate.id, topic: target.dataset.dropTopic || activeTab, url }
          : { type: "item", itemId: duplicate.id, projectId: target.dataset.projectId, url };
        render();
        showToast(duplicate.titleHidden ? "已识别名称已隐藏的旧会话，请确认归属后保存" : "已识别已导入的旧会话，请确认后保存");
        return;
      }
      modal = target.dataset.dropKind === "chat"
        ? { type: "item", topic: target.dataset.dropTopic || activeTab, title: payload.title, url }
        : { type: "item", projectId: target.dataset.projectId, title: payload.title, url };
      render();
      showToast("已识别旧会话，请确认名称后保存");
    }

    function importNativeThread(target, payload) {
      const threads = Array.isArray(payload?.threads) ? payload.threads : [payload];
      const validThreads = threads.filter(thread => thread?.title && thread?.url);
      if (!target || !validThreads.length) return;
      const kind = target.dataset.dropKind === "chat" ? "chat" : "work";
      const unknown = validThreads.filter(thread => !["chat", "work"].includes(thread.surfaceKind));
      const mismatched = validThreads.filter(thread => thread.surfaceKind && thread.surfaceKind !== kind);
      if (unknown.length || mismatched.length) {
        const sourceLabel = mismatched[0]?.surfaceKind === "chat" ? "Chat" : mismatched[0]?.surfaceKind === "work" ? "Work" : "未知类型会话";
        const destinationLabel = kind === "chat" ? "Chats" : "Work 项目";
        showToast(`${sourceLabel} 不能移入 ${destinationLabel}；类型不匹配，未导入任何会话`);
        return;
      }
      const now = Date.now();
      const nextItems = validThreads.map((thread, index) => ({
        id: `item-${now}-${index}`,
        title: String(thread.title).trim(),
        kind,
        topic: kind === "chat" ? (target.dataset.dropTopic || activeTab || "professional") : null,
        projectId: kind === "work" ? target.dataset.projectId : null,
        pinned: false,
        titleHidden: false,
        marker: "p2",
        runtimeStatus: thread.runtimeStatus || "idle",
        createdAt: thread.createdAt || "",
        updatedAt: thread.updatedAt || "",
        updatedLabel: "刚刚",
        url: thread.url,
        hostId: thread.hostId || ""
      }));
      updateBoard(current => {
        for (const nextItem of nextItems) {
          const duplicate = matchingThreadItem(current.items, nextItem.url);
          if (duplicate) {
            duplicate.kind = nextItem.kind;
            duplicate.topic = nextItem.topic;
            duplicate.projectId = nextItem.projectId;
            duplicate.updatedLabel = "刚刚";
            if (nextItem.hostId) duplicate.hostId = nextItem.hostId;
          } else {
            current.items.unshift(nextItem);
          }
        }
      });
      const countLabel = nextItems.length > 1 ? `${nextItems.length} 条会话已批量加入` : "已加入";
      showToast(kind === "chat" ? `${countLabel} ${nextItems[0].topic === "personal" ? "个人会话" : "专业会话"}` : `${countLabel} ${projectName(nextItems[0].projectId)}`);
    }

    function storeCreatedThread(payload, destination) {
      if (!payload?.title || !payload?.url) return false;
      const kind = destination?.kind === "work" ? "work" : "chat";
      const validatedUrl = sessionUrl(payload.url, kind);
      if (!validatedUrl) return false;
      const nextItem = {
        id: `item-${Date.now()}`,
        title: String(payload.title).trim(),
        kind,
        topic: kind === "chat" ? (destination.topic || "professional") : null,
        projectId: kind === "work" ? destination.projectId : null,
        pinned: false,
        titleHidden: false,
        marker: "p2",
        runtimeStatus: payload.runtimeStatus || "idle",
        createdAt: payload.createdAt || "",
        updatedAt: payload.updatedAt || "",
        updatedLabel: "刚刚",
        url: validatedUrl,
        hostId: payload.hostId || ""
      };
      updateBoard(current => {
        const duplicate = matchingThreadItem(current.items, nextItem.url);
        if (duplicate) {
          Object.assign(duplicate, {
            title: nextItem.title,
            runtimeStatus: nextItem.runtimeStatus,
            createdAt: nextItem.createdAt || duplicate.createdAt,
            updatedAt: nextItem.updatedAt || duplicate.updatedAt,
            updatedLabel: nextItem.updatedLabel,
            url: nextItem.url,
            hostId: nextItem.hostId || duplicate.hostId
          });
        }
        else current.items.unshift(nextItem);
      });
      if (embeddedMode) {
        try {
          window.parent.localStorage.setItem(storageKey, JSON.stringify(board));
        } catch (_) {
          showToast("保存失败，Aboard 会继续等待后重试");
          return false;
        }
      }
      return true;
    }

    function updateConditionalFields() {
      const kindSelect = document.getElementById("item-kind");
      const topicField = document.getElementById("topic-field");
      const projectField = document.getElementById("project-field");
      if (!kindSelect || !topicField || !projectField) return;
      const update = () => {
        const isChat = kindSelect.value === "chat";
        topicField.style.display = isChat ? "grid" : "none";
        projectField.style.display = isChat ? "none" : "grid";
      };
      kindSelect.addEventListener("change", update);
      update();
    }

    document.addEventListener("click", event => {
      const tab = event.target.closest("[data-tab]");
      if (tab) { activeTab = tab.dataset.tab; render(); return; }

      const titleVisibility = event.target.closest("[data-title-visibility]");
      if (titleVisibility) {
        const itemId = titleVisibility.dataset.titleVisibility;
        let hidden = false;
        updateBoard(current => {
          const item = current.items.find(entry => entry.id === itemId);
          if (!item) return;
          item.titleHidden = !item.titleHidden;
          hidden = item.titleHidden;
        });
        showToast(hidden ? "会话名称已隐藏" : "会话名称已显示");
        const nextButton = [...document.querySelectorAll("[data-title-visibility]")]
          .find(button => button.dataset.titleVisibility === itemId);
        try { nextButton?.focus({ preventScroll: true }); }
        catch (_) { nextButton?.focus(); }
        return;
      }

      const priorityButton = event.target.closest("[data-priority-menu]");
      if (priorityButton) { openFloatingMenu("priority", priorityButton.dataset.priorityMenu, priorityButton); return; }

      const sortButton = event.target.closest("[data-sort-menu]");
      if (sortButton) { openFloatingMenu("sort", sortButton.dataset.sortMenu, sortButton); return; }

      const chatSortButton = event.target.closest("[data-chat-sort-menu]");
      if (chatSortButton) { openFloatingMenu("chat-sort", chatSortButton.dataset.chatSortMenu, chatSortButton); return; }

      const priorityChoice = event.target.closest("[data-set-priority]");
      if (priorityChoice) {
        floatingMenu = null;
        updateBoard(current => {
          const item = current.items.find(entry => entry.id === priorityChoice.dataset.itemId);
          if (item) item.marker = priorityChoice.dataset.setPriority;
        });
        return;
      }

      const sortChoice = event.target.closest("[data-set-sort]");
      if (sortChoice) {
        floatingMenu = null;
        updateBoard(current => {
          if (sortChoice.dataset.chatTopic) current.chatSortBy[sortChoice.dataset.chatTopic] = sortChoice.dataset.setSort;
          else {
            const project = current.projects.find(entry => entry.id === sortChoice.dataset.projectId);
            if (project) project.sortBy = sortChoice.dataset.setSort;
          }
        });
        return;
      }

      const pin = event.target.closest("[data-pin]");
      if (pin) {
        updateBoard(current => {
          const item = current.items.find(entry => entry.id === pin.dataset.pin);
          if (item) item.pinned = !item.pinned;
        });
        return;
      }

      const opener = event.target.closest("[data-open]");
      if (opener) { openItem(opener.dataset.open, opener); return; }

      const editor = event.target.closest("[data-edit]");
      if (editor) { modal = { type: "item", itemId: editor.dataset.edit }; render(); return; }

      const projectEditor = event.target.closest("[data-edit-project]");
      if (projectEditor) { modal = { type: "project", projectId: projectEditor.dataset.editProject }; render(); return; }

      const projectItemButton = event.target.closest("[data-add-project-item]");
      if (projectItemButton) { modal = { type: "item", projectId: projectItemButton.dataset.addProjectItem }; render(); return; }

      const projectWorkButton = event.target.closest("[data-create-project-work]");
      if (projectWorkButton) {
        window.parent.postMessage({ method: "conversation-dashboard/create-native", destination: { kind: "work", projectId: projectWorkButton.dataset.createProjectWork } }, "*");
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "add-chat") {
        window.parent.postMessage({ method: "conversation-dashboard/create-native", destination: { kind: "chat", topic: activeTab } }, "*");
        return;
      }
      if (action === "add-project") { modal = { type: "project" }; render(); return; }
      if (action === "fullscreen") {
        window.openai?.requestDisplayMode?.({ mode: "fullscreen" });
        return;
      }

      if (event.target.closest("[data-close-modal]")) { modal = null; render(); return; }
      if (event.target.matches("[data-modal-backdrop]")) { modal = null; render(); return; }
      if (floatingMenu && !event.target.closest(".floating-menu")) { floatingMenu = null; render(); return; }

      if (event.target.closest("[data-delete-item]")) {
        const id = modal?.itemId;
        modal = null;
        updateBoard(current => { current.items = current.items.filter(item => item.id !== id); });
      }

      if (event.target.closest("[data-delete-project]")) {
        const id = modal?.projectId;
        modal = null;
        updateBoard(current => {
          current.projects = current.projects.filter(project => project.id !== id);
          current.items = current.items.filter(item => item.projectId !== id);
        });
      }
    });

    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        document.getElementById("search")?.focus();
      }
      if (event.key === "Escape") {
        if (document.getElementById("drag-guide")?.classList.contains("show")
          || document.querySelector(".is-drop-active, .is-drop-invalid")) setDragGuide(false);
        if (embeddedMode) window.parent.postMessage({ method: "conversation-dashboard/native-drag-cancel" }, "*");
        if (modal) { modal = null; render(); }
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-open]")) {
        event.preventDefault();
        openItem(event.target.dataset.open, event.target);
      }
    });

    document.addEventListener("input", event => {
      if (event.target.id === "item-url") {
        event.target.setCustomValidity("");
        return;
      }
      if (event.target.id === "project-name") {
        const counter = document.querySelector('[data-char-count="project-name"]');
        if (counter) counter.textContent = `${[...event.target.value].length}/30`;
        return;
      }
      if (event.target.id === "search") {
        if (composingSearch || event.isComposing) return;
        query = event.target.value;
        const position = event.target.selectionStart;
        render();
        const next = document.getElementById("search");
        next.focus();
        next.setSelectionRange(position, position);
      }
    });

    document.addEventListener("compositionstart", event => {
      if (event.target.id === "search") composingSearch = true;
    });

    document.addEventListener("compositionend", event => {
      if (event.target.id !== "search") return;
      composingSearch = false;
      query = event.target.value;
      const position = event.target.selectionStart;
      render();
      const next = document.getElementById("search");
      next?.focus();
      next?.setSelectionRange(position, position);
    });

    const handledDropSessions = new Set();

    function commitNativeDrop(target, payload, sessionId = "") {
      if (sessionId && handledDropSessions.has(sessionId)) {
        if (embeddedMode) window.parent.postMessage({ method: "conversation-dashboard/native-drop-ack", sessionId }, "*");
        return;
      }
      if (sessionId) {
        handledDropSessions.add(sessionId);
        setTimeout(() => handledDropSessions.delete(sessionId), 30_000);
      }
      importNativeThread(target, payload);
      if (embeddedMode) window.parent.postMessage({ method: "conversation-dashboard/native-drop-ack", sessionId }, "*");
    }

    function clearInternalDragStyles() {
      document.querySelectorAll(".is-dragging, .is-insert-before, .is-insert-after").forEach(element => element.classList.remove("is-dragging", "is-insert-before", "is-insert-after"));
      delete document.documentElement.dataset.projectDragging;
      clearInternalInsertionIndicator();
    }

    function clearInternalInsertionIndicator() {
      const indicator = document.getElementById("internal-insertion-indicator");
      if (!indicator) return;
      indicator.classList.remove("show");
      indicator.style.removeProperty("left");
      indicator.style.removeProperty("top");
      indicator.style.removeProperty("width");
      indicator.removeAttribute("data-placement");
      indicator.removeAttribute("data-target-item");
      indicator.removeAttribute("data-project-lane");
    }

    function showInternalInsertionIndicator(position) {
      const indicator = document.getElementById("internal-insertion-indicator");
      const anchor = position?.row || position?.container;
      if (!indicator || !anchor) return false;
      const rect = anchor.getBoundingClientRect();
      if (!rect.width || !rect.height) return false;
      const isTab = anchor.matches?.(".tab");
      const isProjectLaneEnd = anchor.matches?.("[data-project-lane-end]");
      const previousProject = isProjectLaneEnd && anchor.previousElementSibling?.matches?.("[data-drag-project]")
        ? anchor.previousElementSibling.getBoundingClientRect()
        : null;
      const y = position.row
        ? (position.placement === "before" ? rect.top : rect.bottom)
        : (isTab
            ? rect.bottom - 1
            : (isProjectLaneEnd ? (previousProject ? (previousProject.bottom + rect.top) / 2 : rect.top + 1) : rect.top + Math.min(8, rect.height / 2)));
      const inset = Math.min(10, Math.max(4, rect.width / 8));
      indicator.style.left = `${Math.round(rect.left + inset)}px`;
      indicator.style.top = `${Math.round(y - 1)}px`;
      indicator.style.width = `${Math.max(20, Math.round(rect.width - inset * 2))}px`;
      indicator.dataset.placement = position.row ? position.placement : (isTab ? "tab" : "empty");
      indicator.dataset.targetItem = position.targetItemId || "";
      indicator.classList.add("show");
      return true;
    }

    function itemScope(item) {
      return item?.kind === "chat"
        ? { kind: "chat", topic: item.topic || "professional", key: `chat:${item.topic || "professional"}` }
        : { kind: "work", projectId: item?.projectId || "", key: `work:${item?.projectId || ""}` };
    }

    function targetScope(target) {
      return target?.dataset.dropKind === "chat"
        ? { kind: "chat", topic: target.dataset.dropTopic || activeTab, key: `chat:${target.dataset.dropTopic || activeTab}` }
        : { kind: "work", projectId: target?.dataset.projectId || "", key: `work:${target?.dataset.projectId || ""}` };
    }

    function itemsInScope(current, scope) {
      return current.items.filter(item => scope.kind === "chat"
        ? item.kind === "chat" && (item.topic || "professional") === scope.topic
        : item.kind !== "chat" && item.projectId === scope.projectId);
    }

    function scopeSortBy(scope) {
      return scope.kind === "chat"
        ? board.chatSortBy?.[scope.topic] || "updated"
        : board.projects.find(project => project.id === scope.projectId)?.sortBy || "updated";
    }

    function setScopeSortBy(current, scope, sortBy) {
      if (scope.kind === "chat") current.chatSortBy[scope.topic] = sortBy;
      else {
        const project = current.projects.find(entry => entry.id === scope.projectId);
        if (project) project.sortBy = sortBy;
      }
    }

    function assignManualOrder(items) {
      items.forEach((item, index) => { item.manualOrder = index + 1; });
    }

    function currentVisibleScopeOrder(scope) {
      return sortItems(itemsInScope(board, scope), scopeSortBy(scope));
    }

    function internalItemPosition(event) {
      const row = event.target.closest?.("[data-drag-item]");
      if (!row || row.dataset.dragItem === internalDrag?.itemId) return { targetItemId: "", placement: "end" };
      const rect = row.getBoundingClientRect();
      return { targetItemId: row.dataset.dragItem, placement: event.clientY < rect.top + rect.height / 2 ? "before" : "after", row };
    }

    function insertionContainer(target) {
      if (target?.matches?.(".tab")) return target;
      return target?.matches?.(".chat-list")
        ? target
        : target?.querySelector?.(".project-items") || target?.closest?.(".project-card")?.querySelector?.(".project-items") || null;
    }

    function nearestInsertionPosition(event, target, item) {
      const direct = internalItemPosition(event);
      const directItem = board.items.find(entry => entry.id === direct.targetItemId);
      if (direct.row && Boolean(directItem?.pinned) === Boolean(item?.pinned)) return direct;
      const container = insertionContainer(target);
      const rows = [...(container?.querySelectorAll?.("[data-drag-item]") || [])]
        .filter(row => row.dataset.dragItem !== internalDrag?.itemId);
      const candidates = rows.filter(row => Boolean(board.items.find(entry => entry.id === row.dataset.dragItem)?.pinned) === Boolean(item?.pinned));
      if (!candidates.length) {
        if (rows.length) {
          const boundary = item?.pinned ? rows.find(row => !board.items.find(entry => entry.id === row.dataset.dragItem)?.pinned) : [...rows].reverse().find(row => board.items.find(entry => entry.id === row.dataset.dragItem)?.pinned);
          if (boundary) return { targetItemId: boundary.dataset.dragItem, placement: item?.pinned ? "before" : "after", row: boundary, container, boundary: true };
        }
        return { targetItemId: "", placement: "end", container };
      }
      for (const row of candidates) {
        const rect = row.getBoundingClientRect();
        if (event.clientY < rect.top + rect.height / 2) return { targetItemId: row.dataset.dragItem, placement: "before", row, container };
      }
      const row = candidates.at(-1);
      return { targetItemId: row.dataset.dragItem, placement: "after", row, container };
    }

    function updateInternalItemFeedback(event, target) {
      document.querySelectorAll(".is-insert-before, .is-insert-after").forEach(element => element.classList.remove("is-insert-before", "is-insert-after"));
      clearInternalInsertionIndicator();
      // Internal item movement uses insertion markers only. Region overlays are
      // reserved for native sidebar imports, where the destination scope—not a
      // precise list position—is the action being communicated.
      clearNativeDropFeedback();
      const item = board.items.find(entry => entry.id === internalDrag?.itemId);
      const destination = targetScope(target);
      const source = itemScope(item);
      const valid = item?.kind === destination.kind;
      if (!valid || (source.key === destination.key && query)) return;
      const position = nearestInsertionPosition(event, target, item);
      if (source.key === destination.key && (!position.targetItemId || position.boundary)) return;
      const canShowInsertion = !query;
      if (!canShowInsertion) return;
      if (position.row) position.row.classList.add(position.placement === "before" ? "is-insert-before" : "is-insert-after");
      showInternalInsertionIndicator(position);
    }

    function autoScrollInternalList(event, target) {
      if (internalDrag?.type !== "item") return;
      const list = target.closest?.(".project-card")?.querySelector(".project-items") || target.closest?.(".chat-list");
      if (!list || list.scrollHeight <= list.clientHeight) return;
      const rect = list.getBoundingClientRect();
      const edge = 34;
      if (event.clientY < rect.top + edge) list.scrollTop -= 12;
      else if (event.clientY > rect.bottom - edge) list.scrollTop += 12;
    }

    function moveInternalItem(target, position = { targetItemId: "", placement: "end" }) {
      const item = board.items.find(entry => entry.id === internalDrag?.itemId);
      if (!item || !target) return false;
      const source = itemScope(item);
      const destination = targetScope(target);
      if (item.kind !== destination.kind) {
        showToast(`${item.kind === "chat" ? "Chat" : "Work"} 不能移入 ${destination.kind === "chat" ? "Chats" : "Work"}；类型不匹配`);
        return false;
      }
      if (query && source.key === destination.key) {
        showToast("清除搜索后可手动排序");
        return false;
      }
      const sameScope = source.key === destination.key;
      const targetItem = board.items.find(entry => entry.id === position.targetItemId);
      if (sameScope && (!targetItem || targetItem.id === item.id)) return false;
      if (sameScope && Boolean(targetItem.pinned) !== Boolean(item.pinned)) {
        showToast(item.pinned ? "置顶会话只能在置顶区域内排序" : "普通会话不能排到置顶会话之前");
        return false;
      }
      const previousSort = scopeSortBy(destination);
      const destinationVisibleOrder = currentVisibleScopeOrder(destination).map(entry => entry.id);
      updateBoard(current => {
        const currentItem = current.items.find(entry => entry.id === item.id);
        if (!currentItem) return;
        if (destination.kind === "chat") {
          currentItem.topic = destination.topic;
          currentItem.projectId = null;
        } else {
          currentItem.projectId = destination.projectId;
          currentItem.topic = null;
        }
        const destinationItems = destinationVisibleOrder
          .map(id => current.items.find(candidate => candidate.id === id))
          .filter(candidate => candidate && candidate.id !== currentItem.id);
        const sourceIndex = destinationItems.findIndex(entry => entry.id === currentItem.id);
        if (sourceIndex >= 0) destinationItems.splice(sourceIndex, 1);
        let insertionIndex = destinationItems.length;
        const targetIndex = destinationItems.findIndex(entry => entry.id === position.targetItemId);
        if (targetIndex >= 0) insertionIndex = targetIndex + (position.placement === "after" ? 1 : 0);
        if (!currentItem.pinned) insertionIndex = Math.max(insertionIndex, destinationItems.filter(entry => entry.pinned).length);
        destinationItems.splice(insertionIndex, 0, currentItem);
        assignManualOrder(destinationItems);
        setScopeSortBy(current, destination, "manual");
      });
      if (sameScope) showToast(previousSort === "manual" ? "手动顺序已更新" : "已切换为手动排序");
      else showToast(destination.kind === "chat" ? `已移到${destination.topic === "personal" ? "个人会话" : "专业会话"}` : `已移到 ${projectName(destination.projectId)}`);
      return true;
    }

    function projectDropPosition(event, laneElement) {
      if (!laneElement) return null;
      const displayedLane = Math.max(0, Math.min(2, Number(laneElement.dataset.projectDropLane) || 0));
      const sourceId = internalDrag?.projectId || "";
      const laneEnd = event.target.closest?.("[data-project-lane-end]");
      if (laneEnd) return { lane: displayedLane, placement: "end", laneEnd };
      const directCard = event.target.closest?.("[data-drag-project]");
      if (directCard && directCard.dataset.dragProject !== sourceId) {
        const rect = directCard.getBoundingClientRect();
        return {
          lane: Math.max(0, Math.min(2, Number(directCard.dataset.projectLayoutLane) || displayedLane)),
          targetProjectId: directCard.dataset.dragProject,
          placement: event.clientY < rect.top + rect.height / 2 ? "before" : "after",
          card: directCard
        };
      }
      const candidates = [...laneElement.querySelectorAll(":scope > [data-drag-project]")]
        .filter(card => card.dataset.dragProject !== sourceId);
      const next = candidates.find(card => {
        const rect = card.getBoundingClientRect();
        return event.clientY < rect.top + rect.height / 2;
      });
      if (next) {
        return {
          lane: Math.max(0, Math.min(2, Number(next.dataset.projectLayoutLane) || displayedLane)),
          targetProjectId: next.dataset.dragProject,
          placement: "before",
          card: next
        };
      }
      const last = candidates.at(-1);
      if (last && !laneEnd) {
        return {
          lane: Math.max(0, Math.min(2, Number(last.dataset.projectLayoutLane) || displayedLane)),
          targetProjectId: last.dataset.dragProject,
          placement: "after",
          card: last
        };
      }
      return { lane: displayedLane, placement: "end", laneEnd: laneElement.querySelector("[data-project-lane-end]") || laneElement };
    }

    function updateProjectDropFeedback(event, laneElement) {
      clearInternalInsertionIndicator();
      const position = projectDropPosition(event, laneElement);
      if (!position) return null;
      showInternalInsertionIndicator(position.card
        ? { row: position.card, placement: position.placement, targetItemId: position.targetProjectId }
        : { container: position.laneEnd || laneElement, targetItemId: "" });
      const indicator = document.getElementById("internal-insertion-indicator");
      if (indicator) indicator.dataset.projectLane = String(position.lane);
      return position;
    }

    function reorderProject(position) {
      const sourceId = internalDrag?.projectId;
      const targetLane = Math.max(0, Math.min(2, Number(position?.lane) || 0));
      if (!sourceId || !position) return false;
      updateBoard(current => {
        const moved = current.projects.find(project => project.id === sourceId);
        if (!moved) return;
        const lanes = Array.from({ length: 3 }, (_, lane) => current.projects
          .filter(project => project.id !== sourceId && projectLayoutLane(project, current.projects) === lane)
          .sort((a, b) => projectLayoutOrder(a, current.projects) - projectLayoutOrder(b, current.projects) || Number(a.order || 0) - Number(b.order || 0)));
        const destination = lanes[targetLane];
        let insertionIndex = destination.length;
        if (position.targetProjectId) {
          const targetIndex = destination.findIndex(project => project.id === position.targetProjectId);
          if (targetIndex >= 0) insertionIndex = targetIndex + (position.placement === "after" ? 1 : 0);
        }
        destination.splice(insertionIndex, 0, moved);
        lanes.forEach((entries, lane) => entries.forEach((project, index) => {
          project.layoutLane = lane;
          project.layoutOrder = index + 1;
        }));
        lanes.flat().forEach((project, index) => { project.order = index + 1; });
      });
      showToast(`项目已移到第 ${targetLane + 1} 列`);
      return true;
    }

    document.addEventListener("dragstart", event => {
      const item = event.target.closest?.("[data-drag-item]");
      if (item && !event.target.closest("button")) {
        clearNativeDropFeedback();
        internalDrag = { type: "item", itemId: item.dataset.dragItem };
        item.classList.add("is-dragging");
        if (event.dataTransfer) { event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/x-aboard-item", item.dataset.dragItem); }
        return;
      }
      const project = event.target.closest?.("[data-drag-project]");
      if (project && !event.target.closest("button, .project-tools, .project-items, [data-open]")) {
        internalDrag = { type: "project", projectId: project.dataset.dragProject };
        document.documentElement.dataset.projectDragging = "true";
        project.classList.add("is-dragging");
        if (event.dataTransfer) { event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/x-aboard-project", project.dataset.dragProject); }
        return;
      }
      if (project) event.preventDefault();
    });

    document.addEventListener("dragend", () => {
      internalDrag = null;
      clearInternalDragStyles();
    });
    document.addEventListener("dragenter", event => {
      const projectLane = internalDrag?.type === "project" ? event.target.closest?.("[data-project-drop-lane]") : null;
      if (projectLane) {
        event.preventDefault();
        updateProjectDropFeedback(event, projectLane);
        return;
      }
      const target = event.target.closest?.("[data-drop-kind]");
      if (!target) return;
      if (internalDrag?.type === "item") {
        event.preventDefault();
        updateInternalItemFeedback(event, target);
        return;
      }
      const nativeThread = nativePayloadFromTransfer(event.dataTransfer);
      if (!isNativeThreadDrag(event.dataTransfer, nativeThread)) return;
      const valid = validateDropTarget(target, nativeThread, event.dataTransfer);
      // Register every Aboard Chat/Work region as a native drop target, including
      // mismatches. The type guard runs after release so macOS always ends the
      // three-finger drag instead of leaving a stuck system drag image.
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      setNativeDropFeedback(target, valid);
      setDragGuide(true);
    });

    document.addEventListener("dragover", event => {
      const projectLane = internalDrag?.type === "project" ? event.target.closest?.("[data-project-drop-lane]") : null;
      if (projectLane) {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
        updateProjectDropFeedback(event, projectLane);
        return;
      }
      const target = event.target.closest?.("[data-drop-kind]");
      if (!target) return;
      if (internalDrag?.type === "item") {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
        autoScrollInternalList(event, target);
        updateInternalItemFeedback(event, target);
        return;
      }
      const nativeThread = nativePayloadFromTransfer(event.dataTransfer);
      if (!isNativeThreadDrag(event.dataTransfer, nativeThread)) return;
      const valid = validateDropTarget(target, nativeThread, event.dataTransfer);
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      setNativeDropFeedback(target, valid);
      setDragGuide(true);
    });

    document.addEventListener("dragleave", event => {
      if (internalDrag?.type === "project") {
        const projectLane = event.target.closest?.("[data-project-drop-lane]");
        if (projectLane && (!event.relatedTarget || !projectLane.contains(event.relatedTarget))) clearInternalInsertionIndicator();
        return;
      }
      const target = event.target.closest?.("[data-drop-kind]");
      if (!target) return;
      if (event.relatedTarget && target.contains(event.relatedTarget)) return;
      if (activeNativeDropTarget === target) clearNativeDropFeedback();
    });

    document.addEventListener("drop", event => {
      const projectLane = internalDrag?.type === "project" ? event.target.closest?.("[data-project-drop-lane]") : null;
      if (projectLane) {
        event.preventDefault();
        try {
          reorderProject(projectDropPosition(event, projectLane));
        } finally {
          internalDrag = null;
          clearInternalDragStyles();
          setDragGuide(false);
        }
        return;
      }
      const target = event.target.closest?.("[data-drop-kind]");
      if (!target) return;
      const nativeThread = internalDrag ? null : nativePayloadFromTransfer(event.dataTransfer);
      const nativeThreadDrop = !internalDrag && isNativeThreadDrag(event.dataTransfer, nativeThread);
      if (!internalDrag && !nativeThreadDrop) {
        event.preventDefault();
        setDragGuide(false);
        openImportEditor(target, importPayload(event.dataTransfer));
        return;
      }
      event.preventDefault();
      try {
        if (internalDrag?.type === "item") {
          const item = board.items.find(entry => entry.id === internalDrag.itemId);
          moveInternalItem(target, nearestInsertionPosition(event, target, item));
          return;
        }
        const sessionId = nativeSessionId(event.dataTransfer);
        if (!validateDropTarget(target, nativeThread, event.dataTransfer)) {
          showToast("类型不匹配 · 未导入");
          if (embeddedMode) window.parent.postMessage({ method: "conversation-dashboard/native-drop-ack", sessionId }, "*");
          return;
        }
        if ((nativeThread?.title && nativeThread?.url) || Array.isArray(nativeThread?.threads)) {
          commitNativeDrop(target, nativeThread, sessionId);
          return;
        }
        showToast("没有识别到可导入的会话");
        if (embeddedMode) window.parent.postMessage({ method: "conversation-dashboard/native-drop-ack", sessionId }, "*");
      } finally {
        internalDrag = null;
        clearInternalDragStyles();
        setDragGuide(false);
      }
    });

    document.addEventListener("submit", event => {
      if (event.target.id === "project-form") {
        event.preventDefault();
        const data = new FormData(event.target);
        const existingProject = board.projects.find(entry => entry.id === modal?.projectId);
        const laneLoads = [0, 1, 2].map(lane => board.projects.filter(project => projectLayoutLane(project) === lane).length);
        const nextLane = laneLoads.indexOf(Math.min(...laneLoads));
        const nextLaneOrder = Math.max(0, ...board.projects
          .filter(project => projectLayoutLane(project) === nextLane)
          .map(project => projectLayoutOrder(project))) + 1;
        const project = {
          ...(existingProject || {}),
          id: modal?.projectId || `project-${Date.now()}`,
          name: [...String(data.get("name") || "").trim()].slice(0, 30).join(""),
          accent: String(data.get("accent") || "#146A59"),
          order: existingProject?.order || board.projects.length + 1,
          sortBy: existingProject?.sortBy || "updated",
          layoutLane: existingProject ? projectLayoutLane(existingProject) : nextLane,
          layoutOrder: existingProject ? projectLayoutOrder(existingProject) : nextLaneOrder
        };
        if (!project.name) return;
        const projectId = modal?.projectId;
        modal = null;
        updateBoard(current => {
          const index = current.projects.findIndex(entry => entry.id === projectId);
          if (index >= 0) current.projects[index] = project;
          else current.projects.push(project);
        });
        return;
      }

      if (event.target.id === "item-form") {
        event.preventDefault();
        const data = new FormData(event.target);
        const kind = String(data.get("kind"));
        const previous = modal?.itemId ? board.items.find(item => item.id === modal.itemId) : null;
        const rawUrl = String(data.get("url") || "").trim();
        const url = sessionUrl(rawUrl, kind);
        const urlInput = event.target.querySelector("#item-url");
        urlInput?.setCustomValidity("");
        if (rawUrl && !url) {
          urlInput?.setCustomValidity("请输入有效的 ChatGPT / Codex 原对话链接或 Session ID");
          urlInput?.reportValidity();
          urlInput?.focus();
          showToast("链接格式无效 · 未保存");
          return;
        }
        let hostId = "";
        if (/^codex:\/\/threads\//i.test(url)) {
          try { hostId = new URL(url).searchParams.get("hostId") || ""; }
          catch (_) {}
        }
        const nextItem = {
          ...(previous || {}),
          id: modal?.itemId || `item-${Date.now()}`,
          title: previous?.titleHidden === true ? previous.title : String(data.get("title") || "").trim(),
          kind,
          topic: kind === "chat" ? String(data.get("topic") || "professional") : null,
          projectId: kind === "chat" ? null : String(data.get("projectId") || board.projects[0]?.id || ""),
          pinned: data.get("pinned") === "on",
          titleHidden: previous?.titleHidden === true,
          marker: String(data.get("marker") || "p2"),
          runtimeStatus: previous?.runtimeStatus || "idle",
          createdAt: previous?.createdAt || "",
          updatedAt: previous?.updatedAt || "",
          updatedLabel: "刚刚",
          url,
          hostId,
          manualOrder: previous?.manualOrder
        };
        if (!nextItem.title) return;
        const itemId = modal?.itemId;
        modal = null;
        updateBoard(current => {
          const index = current.items.findIndex(item => item.id === itemId);
          const duplicate = matchingThreadItem(current.items, nextItem.url, itemId || "");
          if (duplicate) {
            const titleHidden = duplicate.titleHidden === true;
            Object.assign(duplicate, nextItem, { id: duplicate.id, titleHidden });
            if (index >= 0) current.items.splice(index, 1);
          } else if (index >= 0) current.items[index] = nextItem;
          else current.items.unshift(nextItem);
        });
        renameNativeItem(previous, nextItem);
      }
    });

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (message?.method === "conversation-dashboard/theme") {
        applyTheme(message.theme);
        return;
      }
      if (message?.method?.startsWith("conversation-dashboard/native-")) {
        if (message.method === "conversation-dashboard/native-metadata") {
          syncNativeMetadata(message.payload);
          return;
        }
        if (message.method === "conversation-dashboard/native-runtime-status") {
          syncNativeRuntimeStatus(message.payload);
          return;
        }
        if (message.method === "conversation-dashboard/native-renamed") {
          showToast("标题已同步到原生会话");
          return;
        }
        if (message.method === "conversation-dashboard/native-rename-error") {
          showToast("Aboard 已保存；原生标题暂未同步，请打开会话后重试");
          return;
        }
        if (message.method === "conversation-dashboard/native-created") {
          if (storeCreatedThread(message.payload, message.destination)) {
            window.parent.postMessage({
              method: "conversation-dashboard/native-created-ack",
              startedAt: message.startedAt,
              creationId: message.creationId
            }, "*");
          }
          return;
        }
        if (message.method === "conversation-dashboard/native-create-error") {
          showToast(message.message || "无法打开原生新建页，请重试");
          return;
        }
        if (message.method === "conversation-dashboard/native-dragstart") {
          setDragGuide(true);
          return;
        }
        if (message.method === "conversation-dashboard/native-dragleave") {
          setDragGuide(false);
          return;
        }
        if (message.method === "conversation-dashboard/native-dragmove") setDragGuide(true);
        const point = message.point || {};
        const target = document.elementFromPoint(Number(point.x) || 0, Number(point.y) || 0)?.closest?.("[data-drop-kind]");
        setNativeDropFeedback(target, target ? validateDropTarget(target, message.payload) : null);
        if (message.method === "conversation-dashboard/native-drop") {
          clearNativeDropFeedback();
          commitNativeDrop(target, message.payload, message.sessionId || "");
          setDragGuide(false);
        }
        return;
      }
      if (message?.method === "ui/notifications/tool-result") {
        const incoming = message.params?.structuredContent?.board;
        if (incoming?.items && incoming?.projects) {
          board = normalizeBoard(incoming);
          activeTab = board.defaultTab || "professional";
          render();
          requestNativeRuntimeStatus();
        }
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      clearTimeout(projectLayoutResizeTimer);
      projectLayoutResizeTimer = setTimeout(() => {
        const nextColumnCount = projectColumnCount();
        if (nextColumnCount === renderedProjectColumnCount) return;
        render();
      }, 90);
    }, { passive: true });

    render();
    if (embeddedMode) {
      window.parent.postMessage({ method: "conversation-dashboard/request-theme" }, "*");
      window.parent.postMessage({ method: "conversation-dashboard/request-native-metadata" }, "*");
      requestNativeRuntimeStatus();
      runtimePollTimer = setInterval(requestNativeRuntimeStatus, 4_000);
    }
    if (!embeddedMode) {
      setTimeout(() => window.openai?.requestDisplayMode?.({ mode: "fullscreen" }), 120);
    }
  </script>
</body>
</html>
