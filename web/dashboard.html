<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aboard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151922;
      --muted: #747b8d;
      --line: #dfe3eb;
      --line-strong: #ccd2de;
      --paper: #f4f6fa;
      --panel: rgba(255, 255, 255, 0.9);
      --white: #ffffff;
      --brand-deep: #0b4f43;
      --brand-jade: #69bfa2;
      --brand-mist: #e1f1ea;
      --accent: #146a59;
      --accent-strong: #0b4f43;
      --accent-soft: #e1f1ea;
      --orange: #ffb36b;
      --green: #1f9d78;
      --warning: #8a5600;
      --danger: #bb3f3f;
      --shadow: 0 18px 48px rgba(35, 43, 66, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --font-display: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      --font-body: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      --font-utility: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    :root[data-theme="light"] { color-scheme: light; }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f2f4fa;
      --muted: #9da5b7;
      --line: #333946;
      --line-strong: #444c5c;
      --paper: #12151b;
      --panel: rgba(28, 32, 41, 0.92);
      --white: #1c2029;
      --accent: #69bfa2;
      --accent-strong: #91d4bc;
      --accent-soft: #173a32;
      --warning: #f0b956;
      --danger: #ff7a84;
      --shadow: 0 20px 54px rgba(0, 0, 0, 0.24);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --ink: #f2f4fa;
        --muted: #9da5b7;
        --line: #333946;
        --line-strong: #444c5c;
        --paper: #12151b;
        --panel: rgba(28, 32, 41, 0.92);
        --white: #1c2029;
        --accent: #69bfa2;
        --accent-strong: #91d4bc;
        --accent-soft: #173a32;
        --warning: #f0b956;
        --danger: #ff7a84;
        --shadow: 0 20px 54px rgba(0, 0, 0, 0.24);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
    }

    html.embedded,
    html.embedded body {
      min-height: 100vh;
    }

    html.embedded .app-shell {
      padding: 20px 22px 22px;
    }

    html.embedded .topbar,
    html.embedded .board {
      max-width: none;
    }

    html.embedded .board {
      min-height: calc(100vh - 101px);
    }

    html.embedded [data-action="fullscreen"] {
      display: none;
    }

    button, input, select { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at 3% 3%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 25rem),
        radial-gradient(circle at 93% 8%, color-mix(in srgb, var(--orange) 10%, transparent), transparent 23rem),
        var(--paper);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(280px, 520px);
      align-items: center;
      gap: 18px;
      max-width: 1540px;
      margin: 0 auto 18px;
    }

    .brand { min-width: 0; }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--brand-deep);
      overflow: hidden;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      bottom: 6.4px;
      width: 6.6px;
      transform-origin: center bottom;
      border-radius: 2.2px;
    }

    .brand-mark::before {
      height: 17.2px;
      left: 6.4px;
      background: var(--brand-mist);
      transform: rotate(8deg);
    }

    .brand-mark::after {
      height: 12.6px;
      right: 6.4px;
      background: var(--brand-jade);
      transform: rotate(-8deg);
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -0.045em;
      font-weight: 750;
    }

    .brand p {
      margin: 3px 0 0 41px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      translate: 0 -50%;
      color: var(--muted);
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 45px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 48px 0 45px;
      background: color-mix(in srgb, var(--white) 88%, transparent);
      color: var(--ink);
      box-shadow: 0 8px 30px rgba(35, 43, 66, 0.04);
    }

    .search::placeholder { color: var(--muted); }

    .keycap {
      position: absolute;
      right: 12px;
      top: 50%;
      translate: 0 -50%;
      font: 10px var(--font-utility);
      color: var(--muted);
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
    }

    .button {
      height: 43px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 0 15px;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 650;
      transition: translate 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .button:hover { translate: 0 -1px; box-shadow: 0 8px 20px rgba(35, 43, 66, .08); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.icon-only { width: 43px; padding: 0; }

    .board {
      max-width: 1540px;
      min-height: calc(100vh - 112px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 356px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .chat-column {
      position: relative;
      min-width: 0;
      padding: 20px;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--white) 72%, transparent);
    }

    .work-column {
      min-width: 0;
      padding: 20px 24px 24px;
      background: color-mix(in srgb, var(--paper) 46%, transparent);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compact-add {
      height: 30px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .compact-add:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

    .list-add {
      width: 100%;
      height: 36px;
      margin-bottom: 8px;
      border: 1px dashed color-mix(in srgb, var(--accent) 34%, var(--line));
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent-soft) 58%, transparent);
      color: var(--accent-strong);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .list-add:hover { background: var(--accent-soft); border-style: solid; }

    .chat-list-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 36px;
      gap: 7px;
      align-items: start;
      margin-bottom: 8px;
    }

    .chat-list-tools .list-add { margin-bottom: 0; }

    .chat-sort {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chat-sort:hover,
    .chat-sort.is-manual { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

    .section-title {
      margin: 0;
      font: 700 18px/1.2 var(--font-display);
      letter-spacing: -0.025em;
    }

    .count {
      min-width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font: 11px var(--font-utility);
    }

    .ghost-action {
      border: 0;
      padding: 6px 8px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .ghost-action:hover { color: var(--accent); background: var(--accent-soft); }

    .row-action {
      width: 29px;
      height: 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      opacity: .72;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 0 0 12px;
      padding: 4px;
      border-radius: 13px;
      background: var(--paper);
    }

    .tab {
      position: relative;
      overflow: hidden;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .tab-count {
      min-width: 19px;
      height: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      font: 9px var(--font-utility);
    }

    .tab.active {
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(35, 43, 66, .07);
    }

    .chat-list { position: relative; display: grid; gap: 5px; min-height: 74px; }

    .conversation-row {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 7px 6px 7px 10px;
      border: 1px solid transparent;
      border-radius: 13px;
      transition: background 140ms ease, border-color 140ms ease;
      cursor: grab;
    }

    .conversation-row:active { cursor: grabbing; }
    .conversation-row.is-dragging,
    .project-item.is-dragging,
    .project-card.is-dragging { opacity: .48; }

    .conversation-row:hover { background: var(--white); border-color: var(--line); }

    /* Internal item drags use one viewport-level insertion line. Keeping the
       marker outside rows avoids clipping by their progress-fill overflow. */
    .internal-insertion-indicator {
      position: fixed;
      z-index: 48;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
      opacity: 0;
      pointer-events: none;
    }

    .internal-insertion-indicator.show { opacity: 1; }

    .tab.drop-target::after {
      inset: 2px;
      border-width: 1px;
      border-radius: 8px;
      font-size: 9px;
    }
    .conversation-row::before,
    .project-item::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0 auto 0 0;
      width: var(--progress-width, 0%);
      background: color-mix(in srgb, var(--progress-color, var(--accent)) 13%, transparent);
      pointer-events: none;
      transition: background-color 160ms ease;
    }
    .conversation-row.is-running::before,
    .project-item.is-running::before {
      width: var(--progress-width, 0%);
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--progress-color, var(--accent)) 13%, transparent) 0%,
        color-mix(in srgb, var(--progress-color, var(--accent)) 24%, transparent) 48%,
        color-mix(in srgb, var(--progress-color, var(--accent)) 13%, transparent) 100%);
      background-size: 210% 100%;
      animation: live-progress 1.55s cubic-bezier(.2,.8,.2,1) infinite;
    }
    .conversation-row.is-waiting::before,
    .project-item.is-waiting::before { width: 100%; background: color-mix(in srgb, var(--warning) 12%, transparent); }
    @keyframes live-progress { from { background-position: 100% 0; } to { background-position: -110% 0; } }
    .conversation-row > *,
    .project-item > * { position: relative; z-index: 1; }
    .conversation-row.is-item-pinned,
    .project-item.is-item-pinned {
      background: color-mix(in srgb, var(--warning) 9%, var(--white));
      border-color: color-mix(in srgb, var(--warning) 22%, var(--line));
    }

    .row-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--marker-color, var(--line-strong));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--marker-color, var(--line-strong)) 14%, transparent);
    }

    .row-main { min-width: 0; cursor: pointer; }
    .row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .row-title.is-title-hidden,
    .project-item-title.is-title-hidden { color: var(--muted); font-weight: 600; }
    .row-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .runtime-status { color: var(--accent-strong); font-weight: 700; }
    .runtime-status.waiting { color: var(--warning); }
    .runtime-progress {
      color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .runtime-progress::before { content: "·"; margin-right: 6px; color: var(--muted); }

    .marker-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--marker-color, var(--line-strong)); }

    .row-actions { display: flex; gap: 1px; opacity: 1; }
    .row-action { color: var(--muted); }
    .row-action:hover { color: var(--accent); background: var(--accent-soft); opacity: 1; }
    .row-action.is-pinned { color: var(--warning); opacity: 1; }
    .marker-action::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--marker-color, var(--line-strong));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--marker-color, var(--line-strong)) 13%, transparent);
    }

    .work-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .section-title-wrap { display: flex; align-items: center; gap: 9px; }
    .project-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 14px; align-items: stretch; }
    .project-lane {
      display: flex;
      min-width: 0;
      min-height: 100%;
      flex-direction: column;
      gap: 14px;
    }

    .project-lane-end {
      position: relative;
      flex: 1 0 48px;
      min-height: 48px;
      border-radius: 14px;
    }

    .project-card {
      position: relative;
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--white);
      box-shadow: 0 12px 32px rgba(35, 43, 66, .055);
      overflow: hidden;
      cursor: grab;
    }
    .project-card:active { cursor: grabbing; }
    .drop-target::after {
      content: attr(data-drop-label);
      position: absolute;
      inset: 8px;
      z-index: 8;
      display: grid;
      place-items: center;
      border: 2px dashed color-mix(in srgb, var(--accent) 55%, var(--line));
      border-radius: 15px;
      background: color-mix(in srgb, var(--accent-soft) 92%, var(--white));
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 750;
      opacity: 0;
      pointer-events: none;
      transition: opacity 110ms cubic-bezier(.22, 1, .36, 1);
    }

    .drop-target.is-drop-active::after { opacity: 1; transition-duration: 0ms; }
    .drop-target.is-drop-invalid::after {
      content: "类型不匹配 · 未导入";
      opacity: 1;
      transition-duration: 0ms;
      border-color: color-mix(in srgb, var(--danger) 58%, var(--line));
      background: color-mix(in srgb, var(--danger) 10%, var(--white));
      color: var(--danger);
    }

    .project-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--project-accent, var(--accent));
    }

    .project-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-left: 3px;
    }

    .project-name {
      margin: 0;
      font: 700 16px/1.25 var(--font-display);
      letter-spacing: -0.026em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-heading { min-width: 0; flex: 1; overflow: hidden; }

    .project-sub { margin-top: 4px; color: var(--muted); font: 10px var(--font-utility); }

    .project-add {
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .project-add:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

    .project-tools { display: flex; align-items: center; gap: 5px; }
    .project-sort {
      width: 31px;
      height: 31px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .project-sort:hover,
    .project-sort.is-manual,
    .project-edit:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .project-edit { font-size: 0; }

    .project-items {
      display: grid;
      gap: 6px;
      max-height: 268px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding-right: 3px;
    }

    .project-items::-webkit-scrollbar { width: 7px; }
    .project-items::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 99px;
      background: color-mix(in srgb, var(--muted) 42%, transparent);
      background-clip: padding-box;
    }

    .project-item {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      padding: 8px 7px 8px 10px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--paper) 70%, transparent);
      border: 1px solid transparent;
      cursor: grab;
    }
    .project-item:active { cursor: grabbing; }

    .project-item:hover { border-color: var(--line); background: var(--paper); }
    .project-main { min-width: 0; cursor: pointer; }
    .project-item-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .project-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .project-actions { display: flex; opacity: 1; }

    .empty {
      padding: 30px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); }
    .empty-action { margin-top: 12px; height: 34px; }

    .empty-start {
      grid-column: 1 / -1;
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 1px dashed var(--line-strong);
      border-radius: 18px;
      text-align: center;
      color: var(--muted);
    }
    .empty-start strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 15px; }
    .empty-start p { max-width: 38ch; margin: 0 auto 16px; font-size: 12px; line-height: 1.55; }

    .marker-options { display: flex; gap: 8px; align-items: center; }
    .marker-option { position: relative; }
    .marker-option input { position: absolute; opacity: 0; pointer-events: none; }
    .marker-swatch {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
      background: var(--white);
    }
    .marker-swatch::after { content: ""; width: 13px; height: 13px; border-radius: 50%; background: var(--swatch); }
    .marker-option input:checked + .marker-swatch { outline: 3px solid color-mix(in srgb, var(--swatch) 25%, transparent); border-color: var(--swatch); }
    .marker-option input:focus-visible + .marker-swatch { outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent); }

    .floating-menu {
      position: fixed;
      z-index: 55;
      width: 154px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      box-shadow: 0 18px 44px rgba(20, 27, 44, .18);
    }
    .floating-menu button {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      border-radius: 8px;
      padding: 0 9px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 11px;
      text-align: left;
    }
    .floating-menu button:hover,
    .floating-menu button[aria-checked="true"] { background: var(--paper); }
    .priority-chip { width: 9px; height: 9px; border-radius: 50%; background: var(--priority-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--priority-color) 14%, transparent); }
    .floating-menu small { margin-left: auto; color: var(--muted); font-size: 9px; }

    .char-hint { display: flex; justify-content: space-between; gap: 12px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 40;
      max-width: min(90vw, 460px);
      translate: -50% 16px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--ink) 92%, transparent);
      color: var(--paper);
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, translate 180ms ease;
    }

    .toast.show { opacity: 1; translate: -50% 0; }

    .drag-guide {
      position: fixed;
      left: 50%;
      top: 18px;
      z-index: 45;
      translate: -50% -10px;
      padding: 9px 13px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      border-radius: 11px;
      background: color-mix(in srgb, var(--white) 96%, var(--accent-soft));
      color: var(--accent-strong);
      box-shadow: 0 10px 26px rgba(35, 43, 66, .12);
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 110ms cubic-bezier(.22, 1, .36, 1), translate 110ms cubic-bezier(.22, 1, .36, 1);
    }

    .drag-guide.show { opacity: 1; translate: -50% 0; transition-duration: 0ms; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(12, 15, 22, .42);
      backdrop-filter: blur(10px);
    }

    .modal {
      width: min(520px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 30px 80px rgba(8, 12, 20, .28);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 { margin: 0; font: 700 19px var(--font-display); letter-spacing: -.025em; }
    .modal-close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; }
    .form { display: grid; gap: 15px; padding: 20px 22px 22px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .field input,
    .field select {
      width: 100%;
      height: 43px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper);
      color: var(--ink);
    }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-hint { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .check-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--muted); }
    .check-row input { width: 16px; height: 16px; accent-color: var(--accent); }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 4px; }
    .danger-link { margin-right: auto; border: 0; background: transparent; color: #d84b4b; cursor: pointer; font-size: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1180px) {
      .project-grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
    }

    @media (max-width: 880px) {
      .app-shell { padding: 14px; }
      .topbar { grid-template-columns: 1fr auto; }
      .search-wrap { grid-column: 1 / -1; grid-row: 2; }
      .brand p { display: none; }
      .board { grid-template-columns: 1fr; }
      .chat-column { border-right: 0; border-bottom: 1px solid var(--line); }
      .project-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <script id="initial-board" type="application/json">__BOARD_JSON__</script>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drag-guide" class="drag-guide" role="status" aria-live="polite">拖到对应的 Chat 或 Work 区域完成归类 · Esc 取消</div>
  <div id="internal-insertion-indicator" class="internal-insertion-indicator" aria-hidden="true"></div>

  <script>
    const embeddedMode = new URLSearchParams(location.search).get("embedded") === "1" || (() => {
      try { return window.frameElement?.dataset?.conversationDashboard === "true"; }
      catch (_) { return false; }
    })();
    const storageKey = "conversation-dashboard-board-v1";
    const nativeThreadMime = "application/x-aboard-thread+json";
    const legacyNativeThreadMime = "application/x-conversation-dashboard-thread";
    const nativeChatKindMime = "application/x-aboard-kind-chat";
    const nativeWorkKindMime = "application/x-aboard-kind-work";
    if (embeddedMode) document.documentElement.classList.add("embedded");

    function applyTheme(value) {
      const theme = value === "dark" ? "dark" : value === "light" ? "light" : "";
      if (!theme) {
        delete document.documentElement.dataset.theme;
        document.documentElement.style.colorScheme = "";
        return;
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    }

    if (embeddedMode) {
      try { applyTheme(window.frameElement?.dataset?.aboardTheme || ""); }
      catch (_) {}
    }

    const fallbackBoard = { version: 2, defaultTab: "professional", chatSortBy: { professional: "updated", personal: "updated" }, projects: [], items: [] };

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initialBoard() {
      const hostBoard = window.openai?.toolOutput?.board;
      if (hostBoard?.items && hostBoard?.projects) return clone(hostBoard);
      if (embeddedMode) {
        try {
          const saved = window.parent.localStorage.getItem(storageKey);
          const parsed = JSON.parse(saved);
          if (parsed?.items && parsed?.projects) return parsed;
        } catch (_) {}
      }
      try {
        const raw = document.getElementById("initial-board").textContent.trim();
        const parsed = JSON.parse(raw);
        if (parsed?.items && parsed?.projects) return parsed;
      } catch (_) {}
      return clone(fallbackBoard);
    }

    function normalizeBoard(value) {
      const next = clone(value);
      next.version = 2;
      const normalizeSort = sortBy => sortBy === "created" ? "created-asc" : (["manual", "updated", "created-desc", "created-asc", "importance"].includes(sortBy) ? sortBy : "updated");
      next.chatSortBy = {
        professional: normalizeSort(next.chatSortBy?.professional),
        personal: normalizeSort(next.chatSortBy?.personal)
      };
      const orderedProjects = [...(next.projects || [])].sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
      next.projects = orderedProjects.map(project => {
        const storedLane = Number(project.layoutLane);
        const storedOrder = Number(project.layoutOrder);
        const normalized = {
          ...project,
          sortBy: normalizeSort(project.sortBy)
        };
        if (Number.isInteger(storedLane) && storedLane >= 0 && storedLane < 3) normalized.layoutLane = storedLane;
        else delete normalized.layoutLane;
        if (Number.isFinite(storedOrder) && storedOrder > 0) normalized.layoutOrder = storedOrder;
        else delete normalized.layoutOrder;
        return normalized;
      });
      next.items = (next.items || []).map((item, index) => ({
        ...item,
        kind: item.kind === "codex" ? "work" : item.kind,
        titleHidden: item.titleHidden === true,
        marker: ["p0", "p1", "p2"].includes(item.marker) ? item.marker : ({ red: "p0", yellow: "p1", blue: "p2", green: "p2" }[item.marker] || "p2"),
        runtimeStatus: item.runtimeStatus || "idle",
        createdAt: item.createdAt || "",
        updatedAt: item.updatedAt || "",
        manualOrder: Number.isFinite(Number(item.manualOrder)) ? Number(item.manualOrder) : index + 1
      }));
      return next;
    }

    const initialBoardValue = initialBoard();
    document.getElementById("initial-board")?.remove();
    let board = normalizeBoard(initialBoardValue);
    let activeTab = board.defaultTab || "professional";
    let query = "";
    let modal = null;
    let floatingMenu = null;
    let internalDrag = null;
    let activeNativeDropTarget = null;
    let activeNativeDropValidity = null;
    let composingSearch = false;
    let saveTimer = null;
    let toastTimer = null;
    let lastOpenSignature = "";
    let lastOpenAt = 0;
    let liveRuntime = new Map();
    let runtimePollTimer = null;
    let lastRuntimeStatusSignature = "";
    let renderedProjectColumnCount = 0;
    let projectLayoutResizeTimer = null;

    const icons = {
      search: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m16.2 16.2 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      star: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.43 1.08 6.27L12 17.14 6.37 20.1l1.08-6.27L2.9 9.4l6.3-.9L12 2.8Z"/></svg>',
      starOutline: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.22l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V21h-4v-.09a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H3v-4h1a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V3h4v1a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1h1v4h-1a1.7 1.7 0 0 0-.6 1Z" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      sort: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 7h11M8 12h8M8 17h5M4.5 5v14m0 0-2-2m2 2 2-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.8 12s3.35-5.5 9.2-5.5 9.2 5.5 9.2 5.5-3.35 5.5-9.2 5.5S2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.55" stroke="currentColor" stroke-width="1.65"/></svg>',
      eyeOff: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3l18 18M10.7 6.6A9.8 9.8 0 0 1 12 6.5c5.85 0 9.2 5.5 9.2 5.5a15.8 15.8 0 0 1-2.45 3.05M6.2 7.8C4.05 9.35 2.8 12 2.8 12s3.35 5.5 9.2 5.5c1.15 0 2.2-.22 3.15-.58M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      expand: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    const markers = {
      p0: { label: "P0 · 紧急", color: "#E25555", weight: 3 },
      p1: { label: "P1 · 重要", color: "#E7A62B", weight: 2 },
      p2: { label: "P2 · 普通", color: "#AEB4C1", weight: 1 }
    };

    function kindLabel(kind) { return kind === "chat" ? "Chat" : "Work"; }

    function visibleItemTitle(item) { return item.titleHidden ? "名称已隐藏" : item.title; }

    function itemOpenLabel(item) {
      return item.titleHidden ? `打开名称已隐藏的 ${kindLabel(item.kind)} 会话` : `打开 ${item.title}`;
    }

    function itemMarker(item) { return markers[item.marker] || markers.p2; }

    function threadIdFromUrl(url) {
      const raw = String(url || "").trim();
      const encodedId = raw.match(/^codex:\/\/threads\/([^?/#]+)/i)?.[1]
        || raw.match(/^https?:\/\/(?:www\.)?(?:chatgpt\.com|chat\.openai\.com)\/c\/([^?/#]+)/i)?.[1]
        || "";
      if (!encodedId) return "";
      try { return decodeURIComponent(encodedId).trim(); }
      catch (_) { return encodedId.trim(); }
    }

    function normalizedThreadId(url) {
      return threadIdFromUrl(url).toLocaleLowerCase("en-US");
    }

    function matchingThreadItem(items, url, excludeId = "") {
      const candidateUrl = String(url || "").trim();
      if (!candidateUrl) return null;
      const candidateId = normalizedThreadId(candidateUrl);
      return items.find(item => item.id !== excludeId && (item.url === candidateUrl
        || (candidateId && normalizedThreadId(item.url) === candidateId))) || null;
    }

    function relativeTime(value, fallback = "") {
      const time = Date.parse(value || "");
      if (!Number.isFinite(time)) return fallback;
      const diff = Math.max(0, Date.now() - time);
      if (diff < 60_000) return "刚刚";
      if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分钟前`;
      if (diff < 86_400_000) return `${Math.floor(diff / 3_600_000)} 小时前`;
      if (diff < 604_800_000) return `${Math.floor(diff / 86_400_000)} 天前`;
      return new Intl.DateTimeFormat("zh-CN", { month: "short", day: "numeric" }).format(new Date(time));
    }

    function itemTime(item) { return relativeTime(item.updatedAt, item.updatedLabel || ""); }

    function timeValue(value) {
      const parsed = Date.parse(value || "");
      return Number.isFinite(parsed) ? parsed : null;
    }

    function sortLabel(sortBy = "updated") {
      return ({
        manual: "手动排序",
        updated: "最近更新",
        "created-desc": "创建时间倒序",
        "created-asc": "创建时间正序",
        importance: "重要性"
      })[sortBy] || "最近更新";
    }

    function sortItems(items, sortBy = "updated") {
      const result = [...items];
      const pinnedFirst = (a, b) => Number(Boolean(b.pinned)) - Number(Boolean(a.pinned));
      const manual = (a, b) => Number(a.manualOrder || 0) - Number(b.manualOrder || 0);
      const byTime = (aValue, bValue, direction) => {
        const aTime = timeValue(aValue);
        const bTime = timeValue(bValue);
        if (aTime === null && bTime === null) return 0;
        if (aTime === null) return 1;
        if (bTime === null) return -1;
        return direction * (aTime - bTime);
      };
      if (sortBy === "manual") return result.sort((a, b) => pinnedFirst(a, b) || manual(a, b));
      if (sortBy === "created-desc") return result.sort((a, b) => pinnedFirst(a, b) || byTime(a.createdAt, b.createdAt, -1) || manual(a, b));
      if (sortBy === "created-asc" || sortBy === "created") return result.sort((a, b) => pinnedFirst(a, b) || byTime(a.createdAt, b.createdAt, 1) || manual(a, b));
      if (sortBy === "importance") return result.sort((a, b) => pinnedFirst(a, b) || itemMarker(b).weight - itemMarker(a).weight || byTime(a.updatedAt, b.updatedAt, -1) || manual(a, b));
      return result.sort((a, b) => pinnedFirst(a, b) || byTime(a.updatedAt, b.updatedAt, -1) || manual(a, b));
    }

    function projectName(projectId) {
      return board.projects.find(project => project.id === projectId)?.name || "未归类";
    }

    function itemMatches(item) {
      if (!query) return true;
      return String(item.title || "").toLocaleLowerCase("zh-CN").includes(query.toLocaleLowerCase("zh-CN"));
    }

    function liveRuntimeEntry(item) {
      return liveRuntime.get(threadIdFromUrl(item.url)) || null;
    }

    function itemProgress(item) {
      const liveProgress = liveRuntimeEntry(item)?.progress;
      const value = Number.isFinite(Number(liveProgress)) ? Number(liveProgress) : Number(item.progress || 0);
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    function runtimeState(item) {
      const status = String(liveRuntimeEntry(item)?.runtimeStatus || item.runtimeStatus || "idle");
      if (status === "active") return { className: "is-running", label: "进行中", labelClass: "" };
      if (status === "waitingOnApproval") return { className: "is-waiting", label: "等待批准", labelClass: "waiting" };
      if (status === "waitingOnUserInput") return { className: "is-waiting", label: "等待输入", labelClass: "waiting" };
      return { className: "", label: "", labelClass: "" };
    }

    function chatRow(item) {
      const marker = itemMarker(item);
      const runtime = runtimeState(item);
      const progress = itemProgress(item);
      const title = visibleItemTitle(item);
      return `
        <div class="conversation-row ${item.pinned ? "is-item-pinned" : ""} ${runtime.className}" draggable="true" data-drag-item="${escapeHtml(item.id)}" data-progress="${progress}" style="--progress-color:#146A59;--progress-width:${progress}%">
          <span class="row-dot" style="--marker-color:${escapeHtml(marker.color)}" aria-label="${escapeHtml(marker.label)}"></span>
          <div class="row-main" data-open="${escapeHtml(item.id)}" tabindex="0" role="button" aria-label="${escapeHtml(itemOpenLabel(item))}">
            <span class="row-title ${item.titleHidden ? "is-title-hidden" : ""}">${escapeHtml(title)}</span>
            <span class="row-meta"><span>${escapeHtml(itemTime(item))}</span>${runtime.label ? `<span class="runtime-status ${runtime.labelClass}">${runtime.label}</span>` : ""}${progress > 0 ? `<span class="runtime-progress" title="上下文使用量 ${progress}%">${progress}%</span>` : ""}</span>
          </div>
          <div class="row-actions">
            <button type="button" class="row-action title-visibility-action" data-title-visibility="${escapeHtml(item.id)}" role="switch" aria-checked="${String(!item.titleHidden)}" aria-label="${item.titleHidden ? "显示此会话名称" : "隐藏此会话名称"}">${item.titleHidden ? icons.eyeOff : icons.eye}</button>
            <button class="row-action ${item.pinned ? "is-pinned" : ""}" data-pin="${escapeHtml(item.id)}" aria-label="${item.pinned ? "取消置顶" : "置顶"}">${item.pinned ? icons.star : icons.starOutline}</button>
            <button class="row-action marker-action" style="--marker-color:${escapeHtml(marker.color)}" data-priority-menu="${escapeHtml(item.id)}" aria-label="优先级：${escapeHtml(marker.label)}" aria-haspopup="menu"></button>
            <button class="row-action" data-edit="${escapeHtml(item.id)}" aria-label="设置">${icons.edit}</button>
          </div>
        </div>
      `;
    }

    function projectItem(item, project) {
      const marker = itemMarker(item);
      const runtime = runtimeState(item);
      const progress = itemProgress(item);
      const title = visibleItemTitle(item);
      return `
        <div class="project-item ${item.pinned ? "is-item-pinned" : ""} ${runtime.className}" draggable="true" data-drag-item="${escapeHtml(item.id)}" data-progress="${progress}" style="--progress-color:${escapeHtml(project?.accent || "#146A59")};--progress-width:${progress}%">
          <div class="project-main" data-open="${escapeHtml(item.id)}" tabindex="0" role="button" aria-label="${escapeHtml(itemOpenLabel(item))}">
            <span class="project-item-title ${item.titleHidden ? "is-title-hidden" : ""}">${escapeHtml(title)}</span>
            <span class="project-meta"><span>${escapeHtml(itemTime(item))}</span>${runtime.label ? `<span class="runtime-status ${runtime.labelClass}">${runtime.label}</span>` : ""}${progress > 0 ? `<span class="runtime-progress" title="上下文使用量 ${progress}%">${progress}%</span>` : ""}</span>
          </div>
          <div class="project-actions">
            <button type="button" class="row-action title-visibility-action" data-title-visibility="${escapeHtml(item.id)}" role="switch" aria-checked="${String(!item.titleHidden)}" aria-label="${item.titleHidden ? "显示此会话名称" : "隐藏此会话名称"}">${item.titleHidden ? icons.eyeOff : icons.eye}</button>
            <button class="row-action ${item.pinned ? "is-pinned" : ""}" data-pin="${escapeHtml(item.id)}" aria-label="${item.pinned ? "取消置顶" : "置顶"}">${item.pinned ? icons.star : icons.starOutline}</button>
            <button class="row-action marker-action" style="--marker-color:${escapeHtml(marker.color)}" data-priority-menu="${escapeHtml(item.id)}" aria-label="优先级：${escapeHtml(marker.label)}" aria-haspopup="menu"></button>
            <button class="row-action" data-edit="${escapeHtml(item.id)}" aria-label="设置">${icons.edit}</button>
          </div>
        </div>
      `;
    }

    function projectFallbackIndex(project, projects = board.projects) {
      return [...projects]
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
        .findIndex(candidate => candidate.id === project.id);
    }

    function projectLayoutLane(project, projects = board.projects) {
      const stored = Number(project?.layoutLane);
      if (Number.isInteger(stored) && stored >= 0 && stored < 3) return stored;
      return Math.max(0, projectFallbackIndex(project, projects)) % 3;
    }

    function projectLayoutOrder(project, projects = board.projects) {
      const stored = Number(project?.layoutOrder);
      if (Number.isFinite(stored) && stored > 0) return stored;
      return Math.floor(Math.max(0, projectFallbackIndex(project, projects)) / 3) + 1;
    }

    function projectCard(project, position, total) {
      const items = sortItems(board.items.filter(item => item.projectId === project.id && item.kind !== "chat" && itemMatches(item)), project.sortBy || "updated");
      const totalItems = board.items.filter(item => item.projectId === project.id && item.kind !== "chat").length;
      const itemMarkup = items.length ? items.map(item => projectItem(item, project)).join("") : `
        <div class="empty"><strong>${query ? "没有匹配的会话" : "暂无会话"}</strong>${query ? "换一个标题关键词" : "添加或从左侧拖入一个 Work 会话"}</div>
      `;
      return `
        <article class="project-card drop-target" role="listitem" aria-posinset="${position}" aria-setsize="${total}" draggable="true" data-project-layout-index="${position - 1}" data-project-layout-lane="${projectLayoutLane(project)}" data-drag-project="${escapeHtml(project.id)}" data-drop-kind="work" data-project-id="${escapeHtml(project.id)}" data-drop-label="移到 ${escapeHtml(project.name)}" style="--project-accent:${escapeHtml(project.accent || "#146A59")}">
          <div class="project-top">
            <div class="project-heading" title="${escapeHtml(project.name)}">
              <h3 class="project-name">${escapeHtml(project.name)}</h3>
              <div class="project-sub">${totalItems} 个会话</div>
            </div>
            <div class="project-tools">
              <button class="project-add" data-create-project-work="${escapeHtml(project.id)}" aria-label="在 ${escapeHtml(project.name)} 中添加 Work 会话">${icons.plus}</button>
              <button class="project-sort ${project.sortBy === "manual" ? "is-manual" : ""}" data-sort-menu="${escapeHtml(project.id)}" aria-label="${escapeHtml(project.name)} 排序：${escapeHtml(sortLabel(project.sortBy))}" aria-haspopup="menu">${icons.sort}</button>
              <button class="project-add project-edit" data-edit-project="${escapeHtml(project.id)}" aria-label="编辑 ${escapeHtml(project.name)}">${icons.edit}</button>
            </div>
          </div>
          <div class="project-items">${itemMarkup}</div>
        </article>
      `;
    }

    function projectColumnCount() {
      const width = document.documentElement?.clientWidth || window.innerWidth || 0;
      if (width <= 880) return 1;
      if (width <= 1180) return 2;
      return 3;
    }

    function projectGridMarkup(projects) {
      const columnCount = projectColumnCount();
      renderedProjectColumnCount = columnCount;
      if (!projects.length) {
        return '<div class="empty-start"><div><strong>创建第一个 Work 项目</strong><p>创建项目后，可添加或从左侧拖入一个 Work 会话。</p><button class="button primary empty-action" data-action="add-project">＋ 新建项目</button></div></div>';
      }
      const lanes = Array.from({ length: columnCount }, () => []);
      projects.forEach(project => {
        const canonicalLane = projectLayoutLane(project, projects);
        const displayedLane = columnCount === 1 ? 0 : (columnCount === 2 ? Math.min(1, canonicalLane) : canonicalLane);
        lanes[displayedLane].push(project);
      });
      lanes.forEach(entries => entries.sort((a, b) => columnCount === 3
        ? projectLayoutOrder(a, projects) - projectLayoutOrder(b, projects) || Number(a.order || 0) - Number(b.order || 0)
        : Number(a.order || 0) - Number(b.order || 0)));
      const visualPosition = new Map(lanes.flat().map((project, index) => [project.id, index + 1]));
      return lanes.map((entries, laneIndex) => `
        <div class="project-lane" role="presentation" data-project-drop-lane="${laneIndex}">
          ${entries.map(project => projectCard(project, visualPosition.get(project.id), projects.length)).join("")}
          <div class="project-lane-end" data-project-lane-end aria-hidden="true"></div>
        </div>
      `).join("");
    }

    function modalMarkup() {

              <form class="form" id="project-form">

        : { title: modal.title || "", kind: modal.projectId ? "work" : "chat", topic: modal.topic || activeTab || "professional", projectId: modal.projectId || board.projects[0]?.id || "", pinned: false, marker: "p2", url: modal.url || "" };

        : `<div class="field"><label for="item-title">Chat name</label><input id="item-title" name="title" required value="${escapeHtml(value.title)}" placeholder="输入对话名称" /></div>`;

      return `
        <div class="modal-backdrop" data-modal-backdrop>

            <div class="modal-head"><h2 id="modal-title">${item ? "编辑对话" : "添加对话"}</h2><button class="modal-close" data-close-modal aria-label="关闭">×</button></div>
